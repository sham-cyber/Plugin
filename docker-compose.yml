services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  mock-provider:
    build:
      context: ./plugins/fraudguard
      dockerfile: docker/Dockerfile.mock-provider
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20

  bifrost:
    image: fraudguard-bifrost:local
    build:
      context: ${BIFROST_ROOT:?Run plugins/fraudguard/scripts/run-compose-demo.sh to prepare the pinned source}
      dockerfile: plugins/fraudguard/docker/Dockerfile.bifrost
      args:
        VERSION: fraudguard-local
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      APP_DIR: /app/data
      FRAUDGUARD_REDIS_URL: redis://redis:6379/0
      FRAUDGUARD_TENANT_ID: fraudguard-local-demo
      FRAUDGUARD_TENANT_HMAC_KEY: local-only-demo-hmac-key-not-for-production-2026
      FRAUDGUARD_CONFIG_PATH: /app/fraudguard-runtime.json
      FRAUDGUARD_CONFIG_POLL_INTERVAL: 5s
    volumes:
      - bifrost-data:/app/data
      - ./plugins/fraudguard/docker/bifrost-config.json:/app/data/config.json:ro
      - ./plugins/fraudguard/docker/fraudguard-demo-runtime.json:/app/fraudguard-runtime.json:ro
    depends_on:
      redis:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 25s

volumes:
  bifrost-data:
